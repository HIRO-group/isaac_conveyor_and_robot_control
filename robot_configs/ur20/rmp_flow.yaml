# UR20 cuMotion RMPflow config, adapted from the bundled UR10 reference at
# /home/ubuntu/IsaacSim-source/source/extensions/isaacsim.robot_motion.cumotion/robot_configurations/ur10/rmp_flow.yaml
# (this file is not auto-generated by the URDF->XRDF pipeline - it's a
# separate, hand-authored tuning file, same as UR10's own). The rmp_params.*
# gains/weights are RMPflow solver tuning constants, not physical facts about
# the robot, so they're reused as-is from UR10 - only the physically-real
# quantities below were changed, each sourced from this repo's own
# UR20-specific data (see generate_ur20_urdf.py / generate_ur20_xrdf.py),
# not guessed:
#   - joint_velocity_cap_rmp.max_velocity: UR10 used a single global cap
#     (2.15 rad/s) below its own joints' hard specs. UR20's exported
#     robot.urdf <limit velocity=...> per joint: shoulder_pan/lift
#     2.0943951, elbow 2.61799361, wrist_1/2/3 3.66519116 rad/s - the cap
#     must not exceed the SLOWEST joint's hard limit (2.0943951), so 2.0 is
#     used (same below-hard-limit margin convention UR10's own value shows).
#   - body_capsules (base_link): UR20's own collision mesh
#     (meshes/mesh_14.obj) world-frame bbox measured directly via trimesh:
#     [[-0.1225,-0.1225,0.0002],[0.1226,0.1225,0.1086]] -> radius ~0.1225 m
#     (XY half-extent), height ~0.1086 m (Z extent) - both bigger than
#     UR10's base_link (radius 0.09, height 0.22... note UR20's base is
#     wider but shorter, consistent with it being a bulkier, lower-profile
#     mount versus UR10's taller/slimmer base).
#   - body_collision_controllers (wrist_2_link, wrist_3_link, tool0):
#     UR10 used a flat 0.04 m for all three. UR20's wrist_2_link/
#     wrist_3_link collision meshes (mesh_19.obj/mesh_20.obj) measured
#     world-frame bboxes both have ~0.05 m half-extents in X/Y - 0.05 is
#     used uniformly for all three (same "flat value across these 3 links"
#     convention as UR10, scaled to UR20's real measured size).

format: rmpflow
api_version: 2.0

joint_limit_buffers: [.01, .01, .01, .01, .01, .01]

rmp_params:
    cspace_target_rmp:
        metric_scalar: 50.
        position_gain: 100.
        damping_gain: 50.
        robust_position_term_thresh: .5
        inertia: 1.
    cspace_trajectory_rmp:
        p_gain: 80.
        d_gain: 10.
        ff_gain: .25
        weight: 50.
    cspace_affine_rmp:
        final_handover_time_std_dev: .25
        weight: 2000.
    joint_limit_rmp:
        metric_scalar: 1000.
        metric_length_scale: .01
        metric_exploder_eps: 1e-3
        metric_velocity_gate_length_scale: .01
        accel_damper_gain: 200.
        accel_potential_gain: 1.
        accel_potential_exploder_length_scale: .1
        accel_potential_exploder_eps: 1e-2
    joint_velocity_cap_rmp:
        max_velocity: 2.0
        velocity_damping_region: 0.5
        damping_gain: 300.
        metric_weight: 100.
    # accel_p_gain/accel_d_gain rebalanced from UR10's originals
    # (target_rmp: 80./120., axis_target_rmp: 200./40.) - confirmed
    # empirically in this scene/session that the arm consistently converged
    # well short of the actual pick/place target (~0.5-1 m off) regardless
    # of default seed pose or collision-avoidance settings (confirmed via a
    # zero-tracked-obstacles control test: removing collision avoidance
    # entirely made convergence WORSE, not better, ruling it out as the
    # cause). With orientation-tracking gain (200) 2.5x stronger than
    # position-tracking gain (80), and both a large translation (~1.2 m) and
    # a real reorientation needed from the default pose, the solver likely
    # prioritized satisfying orientation over ever making translational
    # progress. Position gain raised well above orientation gain so
    # translation is no longer starved.
    target_rmp:
        accel_p_gain: 300.
        accel_d_gain: 120.
        accel_norm_eps: .075
        metric_alpha_length_scale: .05
        min_metric_alpha: .01
        max_metric_scalar: 10000.
        min_metric_scalar: 2500.
        proximity_metric_boost_scalar: 20.
        proximity_metric_boost_length_scale: .02
        accept_user_weights: false
    axis_target_rmp:
        accel_p_gain: 80.
        accel_d_gain: 40.
        metric_scalar: 10.
        proximity_metric_boost_scalar: 3000.
        proximity_metric_boost_length_scale: .05
        accept_user_weights: false
    # repulsion_gain/metric_scalar/metric_modulation_radius reduced from
    # UR10's original values (1000./500./.5) so repulsion only engages very
    # close to real structure in this more cluttered scene - a reasonable
    # general tightening, though a zero-obstacles control test (see above)
    # confirmed this was NOT the cause of the stuck-short-of-target
    # behavior; kept regardless since it's still a sensible margin for this
    # scene's actual clearances.
    collision_rmp:
        damping_gain: 50.
        damping_std_dev: .04
        damping_robustness_eps: 1e-2
        damping_velocity_gate_length_scale: .01
        repulsion_gain: 300.
        repulsion_std_dev: .01
        metric_modulation_radius: .15
        metric_scalar: 150.
        metric_exploder_std_dev: .02
        metric_exploder_eps: .001
    damping_rmp:
        accel_d_gain: 30.
        metric_scalar: 50.
        inertia: 100.

canonical_resolve:
    max_acceleration_norm: 50.
    projection_tolerance: .01
    verbose: false

body_capsules:
    - name: base_link
      pt1: [0, 0, 0.1086]
      pt2: [0, 0, 0]
      radius: .1225

body_collision_controllers:
  - name: wrist_2_link
    radius: .05
  - name: wrist_3_link
    radius: .05
  - name: tool0
    radius: .05
